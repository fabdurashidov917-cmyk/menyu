<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahifa topilmadi | Zarafshon Grand Restaurant</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, #0a0d12 70%);
    }
    .not-found-card {
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .not-found-code {
      font-family: var(--font-serif);
      font-size: 84px;
      font-weight: 900;
      line-height: 1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="not-found-card">
      <div style="font-size: 48px; margin-bottom: 16px;">🍽️</div>
      <div class="not-found-code">404</div>
      <h2 style="font-family: var(--font-serif); font-size: 24px; margin-bottom: 14px;">Sahifa topilmadi</h2>
      <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 28px; line-height: 1.6;">
        Kechirasiz, siz qidirayotgan sahifa mavjud emas yoki boshqa manzilga ko'chirilgan.
      </p>
      <a href="./index.html" class="btn-gold" style="padding: 12px 28px;">
        ← Bosh sahifa va Menyu ga qaytish
      </a>
    </div>
  </div>
</body>
</html>
